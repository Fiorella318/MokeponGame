    <body>
        <h1 class="title" >MOKEPON!🔥💧🌱</h1>

        <section id="seleccionar-mascotas">
            <h2 class="subtitle">Choose your Mokepon:</h2>
            
            <div id="contenedor-Tarjetas" class="contenedor-Tarjetas"></div>

            <button id="boton-mascota">
                <p>Select</p>
            </button>
        </section>
        
        <section id="ver-mapa">
        
            <h3 class="subtitle">Explore the map with your Mokepon</h3>
        
            <canvas id="mapa"></canvas>
        
            <button id="boton-jugar-solo">Play alone</button> 
    
            <div class="mapa-controles"></div>
        
        
        
            <button id="arriba" ontouchstart="moverArriba()" ontouchend = "detenerMovimiento()" onmouseup="detenerMovimiento()" onmousedown="moverArriba()">Up</button>
        
            <div >
                <button id="izquierda" ontouchstart="moverIzquierda()" ontouchend = "detenerMovimiento()" onmouseup="detenerMovimiento()" onmousedown="moverIzquierda()">Left</button>
        
                <button id="abajo"  ontouchstart="moverAbajo()" ontouchend = "detenerMovimiento()" onmouseup="detenerMovimiento()" onmousedown="moverAbajo()">Down</button>
        
                <button id="derecha"  ontouchstart="moverDerecha()" ontouchend = "detenerMovimiento()" onmouseup="detenerMovimiento()" onmousedown="moverDerecha()">Right</button>
            </div>

        </section>


        <section id = "seleccionar-ataque">
            
            <h2 class="subtitle">Choose your attack:</h2>

            <div id="contenedor-ataques" class="contenedor-botones"></div> 

            <div id="mensajes">
                <p id="resultado">Good luck!</p>

                <section id="reiniciar">
                
                    <button id="boton-reiniciar">Reset</button>
            
                </section>
            </div>
            
            <div class="ataques">
                <div class="jugador">
                    <p>Your Mokepon <span id="mascota-jugador"></span> has <span id="vidas-jugador">0</span> victories</p>
                    <div id="ataques"></div>
                </div>
                
                <div class="enemigo">
                    <p id="texto-enemigo">The enemy's Mokepon <span id="mascota-enemigo"></span> has <span id="vidas-enemigo">0</span> victories</p>
                    <div id="ataques-enemigo"></div>
                </div>
            </div>
            
        </section>

        <script src="./js/mokepon.js"></script>

    </body>
</html>
